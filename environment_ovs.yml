name: ovs
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - pip
  - setuptools
  - wheel
  - ninja
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.0+cu128
      - torchvision==0.22.0+cu128
      - torchaudio==2.7.0+cu128
      - pycocotools==2.0.10
      - yacs==0.1.8
      - fvcore==0.1.5.post20221221
      - iopath==0.1.9
      - omegaconf==2.3.0
      - hydra-core==1.3.2
      - tensorboard==2.20.0
      - matplotlib==3.10.7
      - -r requirements.txt
